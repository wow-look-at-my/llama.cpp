name: CI (cpu)

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: [
      '.github/workflows/build-cpu.yml',
      '.github/workflows/build-cmake-pkg.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.cuh',
      '**/*.swift',
      '**/*.m',
      '**/*.metal',
      '**/*.comp',
      '**/*.glsl',
      '**/*.wgsl'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/build-cpu.yml',
      '.github/workflows/build-cmake-pkg.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp',
      '**/*.cu',
      '**/*.cuh',
      '**/*.swift',
      '**/*.m',
      '**/*.metal',
      '**/*.comp',
      '**/*.glsl',
      '**/*.wgsl'
    ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  build-cmake-pkg:
    uses: ./.github/workflows/build-cmake-pkg.yml

  # Download the shared test model exactly once, cache it, then let every build
  # leg restore it from the cache (instead of each leg hammering HuggingFace and
  # tripping its rate limit). download-models.cmake skips the network when the
  # file already exists with the expected hash, so a restored cache = no fetch.
  fetch-models:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Cache test models
        id: cache-models
        uses: actions/cache@v5
        with:
          path: build/tinyllamas
          key: ggml-ci-models-v2-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: |
            ggml-ci-models-v2-
          # the model is fetched once on Linux (fetch-models) and restored on
          # both Linux and Windows build legs, so the cache must be cross-OS
          enableCrossOsArchive: true

      - name: Download test models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Read model name/hash from the test definition so this never drifts.
          NAME=$(grep -oP 'set\(MODEL_NAME "\K[^"]+' tests/CMakeLists.txt | head -1)
          HASH=$(grep -oP 'set\(MODEL_HASH "\K[^"]+' tests/CMakeLists.txt | head -1)
          echo "Ensuring $NAME ($HASH) is present"
          cmake -DDEST="$PWD/build/$NAME" -DNAME="$NAME" -DHASH="$HASH" \
            -P cmake/download-models.cmake

  ubuntu:
    needs: fetch-models
    strategy:
      matrix:
        include:
          - build: 'x64'
            os: ubuntu-22.04
          - build: 'arm64'
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: cpu-${{ matrix.os }}
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Build Dependencies
        id: build_depends
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip python3-dev python3-wheel \
            libjpeg-dev build-essential libssl-dev \
            git-lfs

      - name: Toolchain workaround (GCC 14)
        if: ${{ contains(matrix.os, 'ubuntu-24.04') }}
        run: |
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Python Dependencies
        id: python_depends
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES="1"
          python3 -m pip install --upgrade pip setuptools
          pip3 install ./gguf-py

      - name: Build
        id: cmake_build
        run: |
          cmake -B build \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DGGML_RPC=ON
          time cmake --build build --config Release -j $(nproc)

      - name: Restore cached test models
        uses: actions/cache/restore@v5
        with:
          path: build/tinyllamas
          key: ggml-ci-models-v2-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: |
            ggml-ci-models-v2-
          # the model is fetched once on Linux (fetch-models) and restored on
          # both Linux and Windows build legs, so the cache must be cross-OS
          enableCrossOsArchive: true

      - name: Test
        id: cmake_test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd build
          ctest -L main --verbose --timeout 900

      - name: Test llama2c conversion
        id: llama2c_test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd build
          # Authenticate to HuggingFace when a token is available (avoids 429s).
          auth=()
          [ -n "${HF_TOKEN:-}" ] && auth=(--header="Authorization: Bearer ${HF_TOKEN}")
          echo "Fetch tokenizer"
          wget "${auth[@]}" https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/tok512.bin
          echo "Fetch llama2c model"
          wget "${auth[@]}" https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/stories260K.bin
          ./bin/llama-convert-llama2c-to-ggml --copy-vocab-from-model ./tok512.bin --llama2c-model stories260K.bin --llama2c-output-model stories260K.gguf
          ./bin/llama-completion -m stories260K.gguf -p "One day, Lily met a Shoggoth" -n 500 -c 256
