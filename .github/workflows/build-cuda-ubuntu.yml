name: CI (CUDA, ubuntu)

on:
  workflow_dispatch: # allows manual triggering
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  cuda:
    runs-on: ubuntu-24.04
    # pulled from NVIDIA's registry - Docker Hub anonymous pulls hit rate limits on shared runners
    container: nvcr.io/nvidia/cuda:12.6.2-devel-ubuntu24.04

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y cmake build-essential ninja-build libgomp1 git libssl-dev

      - name: Build with CMake
        # TODO: Remove GGML_CUDA_CUB_3DOT2 flag once CCCL 3.2 is bundled within CTK and that CTK version is used in this project
        run: |
          cmake -S . -B build -G Ninja \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=89-real \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_CUB_3DOT2=ON
          cmake --build build

      # CPU-side regression test for the Gemma 4 MTP graph-context use-after-free
      # (tests/test-mtp-graph-lifetime.cpp): no GPU, no model weights, no graph
      # compute -- it runs fine on this GPU-less runner. The binary does link the
      # CUDA backend, which carries a DT_NEEDED on libcuda.so.1 (the driver, pulled
      # in by CUDA::cuda_driver for VMM); no driver exists here, so satisfy the
      # loader with the CUDA toolkit's stub. ggml_cuda_init then simply reports
      # 0 CUDA devices and the test runs on CPU.
      - name: Run MTP graph-lifetime test
        run: |
          ln -sfn libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
          export LD_LIBRARY_PATH="/usr/local/cuda/lib64/stubs:${LD_LIBRARY_PATH}"
          ctest --test-dir build -R '^test-mtp-graph-lifetime$' --output-on-failure
