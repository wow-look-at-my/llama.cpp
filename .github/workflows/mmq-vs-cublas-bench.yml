# MMQ (quantized int8 kernels) vs cuBLAS-dequant, measured on the self-hosted
# A6000 (sm_86). Self-contained: fetches its own public gguf, builds llama-bench
# twice (baseline MMQ, and -DGGML_CUDA_FORCE_CUBLAS=ON), benches both, posts a
# side-by-side table to the run summary (and to the step log, so it's readable
# via `gh run view --log`).
#
# Triggers on a push that touches this file (so iterating on it re-runs the
# bench), and via manual dispatch. NOT on every push — it's a ~30 min GPU job.
#
# GGML_CUDA_FORCE_CUBLAS only flips runtime dispatch (ggml_cuda_should_use_mmq
# hard-returns false); both builds still compile the mmq instances. So this
# answers the *runtime* question. Dropping the 21 instances (~264s compile) is
# only worth it if cuBLAS ties-or-wins here.
name: mmq-vs-cublas-bench

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "HF GGUF repo to bench"
        default: "Qwen/Qwen2.5-7B-Instruct-GGUF"
      hf_glob:
        description: "Which gguf(s) to pull"
        default: "*q4_k_m*.gguf"
      cuda_image:
        description: "CUDA devel image (match the box driver)"
        default: "nvidia/cuda:13.0.1-devel-ubuntu24.04"
      prompt_sizes:
        description: "llama-bench -p (prefill batch sizes)"
        default: "512,2048"
      gen_tokens:
        description: "llama-bench -n (decode tokens)"
        default: "128"
  push:
    paths:
      - .github/workflows/mmq-vs-cublas-bench.yml

concurrency:
  group: mmq-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: [self-hosted, gpu, nvidia]
    container:
      image: ${{ inputs.cuda_image || 'nvidia/cuda:13.0.1-devel-ubuntu24.04' }}
      options: --gpus all
    env:
      HF_REPO: ${{ inputs.hf_repo || 'Qwen/Qwen2.5-7B-Instruct-GGUF' }}
      HF_GLOB: ${{ inputs.hf_glob || '*q4_k_m*.gguf' }}
      CUDA_ARCH: "86-real"
      PROMPT_SIZES: ${{ inputs.prompt_sizes || '512,2048' }}
      GEN: ${{ inputs.gen_tokens || '128' }}
      NGL: "99"
      FA: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain + GPU check
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build git curl ca-certificates build-essential python3-pip
          pip3 install -q --break-system-packages "huggingface_hub[cli]" || pip3 install -q "huggingface_hub[cli]"
          nvidia-smi || { echo "::error::no GPU in container (--gpus all / driver)"; exit 1; }

      - name: Fetch model
        run: |
          set -euxo pipefail
          huggingface-cli download "$HF_REPO" --include "$HF_GLOB" --local-dir models
          M=$(find models -name '*.gguf' | sort | head -1)
          test -n "$M" || { echo "::error::no gguf matched $HF_GLOB in $HF_REPO"; exit 1; }
          echo "MODEL=$M" >> "$GITHUB_ENV"
          ls -lh "$M"

      - name: Build llama-bench (MMQ baseline + FORCE_CUBLAS)
        run: |
          set -euxo pipefail
          for v in mmq cublas; do
            args=(-S . -B "build-$v" -G Ninja
                  -DCMAKE_BUILD_TYPE=Release
                  -DGGML_CUDA=ON
                  -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCH")
            if [ "$v" = cublas ]; then args+=(-DGGML_CUDA_FORCE_CUBLAS=ON); fi
            cmake "${args[@]}"
            cmake --build "build-$v" --target llama-bench
          done
          grep -q 'GGML_CUDA_FORCE_CUBLAS:BOOL=ON' build-cublas/CMakeCache.txt \
            || { echo "::error::FORCE_CUBLAS define did not stick"; exit 1; }

      - name: Benchmark
        run: |
          set -uxo pipefail
          common=(-m "$MODEL" -ngl "$NGL" -p "$PROMPT_SIZES" -n "$GEN" -fa "$FA" -r 3 -o md)
          {
            echo "## MMQ vs cuBLAS — sm_86 (\`$CUDA_ARCH\`)"
            echo '```'
            nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
            echo '```'
            echo "Model: \`$(basename "$MODEL")\`  •  -p \`$PROMPT_SIZES\` -n \`$GEN\` -fa \`$FA\`"
            echo
            echo "### Baseline (MMQ — what ships today)"
            ./build-mmq/bin/llama-bench "${common[@]}"
            echo
            echo "### GGML_CUDA_FORCE_CUBLAS=ON (mmq instances unused)"
            ./build-cublas/bin/llama-bench "${common[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
