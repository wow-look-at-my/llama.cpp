# MMQ (quantized int8 kernels) vs cuBLAS-dequant, measured on the self-hosted
# A6000 (sm_86). Answers ONE empirical question: on sm_86, does forcing the
# cuBLAS-dequant path tie-or-beat the hand-written MMQ kernels? If it does, the
# 21 per-quant MMQ template instances (~264s of compile) can be dropped from the
# ollama CUDA build with no runtime loss. If MMQ wins, they stay.
#
# Runs BARE-METAL on the runner (no `container:`). The runner is itself a
# container with no docker daemon reachable (proven: `docker version` ->
# "Cannot connect to the Docker daemon at unix:///var/run/docker.sock"), so a
# container: job dies at the runner's init preflight. We install the toolchain
# directly instead. ccache (auto-used by ggml, GGML_CCACHE=ON) makes the second
# build mostly a cache hit, since GGML_CUDA_FORCE_CUBLAS is a global -D that
# almost no .cu actually reads.
name: mmq-vs-cublas-bench

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: "Space-separated URL(s) to single-file GGUF(s) to bench (each benched on both arms)"
        default: "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q8_0.gguf"
      llama_ref:
        description: "llama.cpp ref to build (blank = the ref that triggered this)"
        default: ""
      prompt_sizes:
        description: "llama-bench -p (prefill batch sizes; a context sweep measures the tok/s-vs-context decay)"
        default: "512,4096,32768,131072"
      gen_tokens:
        description: "llama-bench -n (decode tokens)"
        default: "128"
      flash_attn:
        description: "llama-bench -fa (0/1)"
        default: "1"
  # Runs on every commit (no path filter) so it is a real required check that
  # always produces a pass/fail and is never "missing" on merge commits.
  push:

concurrency:
  # Per-ref group: branches never cancel each other, and a feature-branch run can
  # never cancel a default-branch run. Cancellation is always triggered by the
  # newer run, so an earlier run never cancels a later one. Cancel superseded
  # in-progress runs on feature branches (latest commit wins, no A6000 backlog),
  # but never on the default branch -- every master commit gets a full run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  bench:
    runs-on: [self-hosted, gpu, nvidia]
    env:
      MODEL_URLS: ${{ inputs.model_url || 'https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q8_0.gguf' }}
      CUDA_ARCH: "86-real"
      PROMPT_SIZES: ${{ inputs.prompt_sizes || '512,4096,32768,131072' }}
      GEN: ${{ inputs.gen_tokens || '128' }}
      FA: ${{ inputs.flash_attn || '1' }}
      NGL: "99"
      CUDA_HOME: /usr/local/cuda-12.9
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.llama_ref || github.sha }}

      - name: Install toolchain (cmake/ninja via pip, ccache + CUDA 12.9 via apt)
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # recent cmake (>=3.18 needed for CMAKE_CUDA_ARCHITECTURES=86-real;
          # focal apt ships only 3.16) + ninja, via pip
          if ! command -v cmake >/dev/null; then
            pip3 install -q cmake ninja 2>/dev/null \
              || pip3 install -q --break-system-packages cmake ninja
          fi
          # ccache: ggml auto-uses it (GGML_CCACHE=ON) to cache the 2nd build
          sudo apt-get install -y -q ccache || true
          # CUDA toolkit 12.9 (focal's newest; driver 595 is forward-compatible).
          # cuda-toolkit-12-9 is toolkit-only -- it does NOT touch the driver.
          if [ ! -x "$CUDA_HOME/bin/nvcc" ]; then
            tmp="$(mktemp -d)"; cd "$tmp"
            wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb
            sudo dpkg -i cuda-keyring_1.1-1_all.deb
            sudo apt-get update -qq
            sudo apt-get install -y -q --no-install-recommends cuda-toolkit-12-9
          fi
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"
          echo "CUDACXX=$CUDA_HOME/bin/nvcc" >> "$GITHUB_ENV"
          "$CUDA_HOME/bin/nvcc" --version | tail -2
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader

      - name: Fetch model(s)
        run: |
          set -euxo pipefail
          # dedicated dir -- the repo's own models/ ships ggml-vocab-*.gguf test
          # files that would otherwise be caught by the bench glob and fail to load
          rm -rf benchmodels && mkdir -p benchmodels
          i=0
          for u in $MODEL_URLS; do
            i=$((i+1))
            out="benchmodels/bench-$i.gguf"
            curl -fL --retry 4 --retry-delay 3 -o "$out" "$u"
            test -s "$out" || { echo "::error::model download failed: $u"; exit 1; }
            ls -lh "$out"
          done

      - name: Build llama-bench x2 (MMQ baseline + GGML_CUDA_FORCE_CUBLAS)
        run: |
          set -euxo pipefail
          ccache --zero-stats || true
          for v in mmq cublas; do
            args=(-S . -B "build-$v" -G Ninja
                  -DCMAKE_BUILD_TYPE=Release
                  -DGGML_CUDA=ON
                  -DGGML_CCACHE=ON
                  -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCH")
            if [ "$v" = cublas ]; then args+=(-DGGML_CUDA_FORCE_CUBLAS=ON); fi
            cmake "${args[@]}"
            cmake --build "build-$v" --target llama-bench
          done
          grep -q 'GGML_CUDA_FORCE_CUBLAS:BOOL=ON' build-cublas/CMakeCache.txt \
            || { echo "::error::FORCE_CUBLAS define did not stick"; exit 1; }
          echo "== ccache stats (2nd build should show hits) =="
          ccache --show-stats || true

      - name: Benchmark
        run: |
          set -uxo pipefail
          # This runner's A6000 is shared; capture free VRAM so a context-alloc
          # failure is a diagnosable OOM, not a silent "failed to create context".
          smi() { nvidia-smi --query-gpu=memory.total,memory.used,memory.free --format=csv,noheader; }
          common=(-ngl "$NGL" -p "$PROMPT_SIZES" -n "$GEN" -fa "$FA" -r 3 -o md)
          {
            echo "## MMQ vs cuBLAS - sm_86 (\`$CUDA_ARCH\`, CUDA 12.9)"
            echo '```'
            nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
            echo "VRAM total,used,free at start: $(smi)"
            echo '```'
            echo "-p \`$PROMPT_SIZES\` -n \`$GEN\` -fa \`$FA\`  (pp = prefill, decision-relevant; model col shows quant). VRAM(total,used,free) printed per model."
            # one binary built per arm; bench every downloaded model on both arms
            for m in benchmodels/*.gguf; do
              echo
              echo "### Model: \`$(basename "$m")\`  (VRAM free before: $(smi))"
              echo "#### Baseline (MMQ - what ships today)"
              ./build-mmq/bin/llama-bench -m "$m" "${common[@]}" \
                || { echo "::error::llama-bench (MMQ) failed on $(basename "$m") -- VRAM: $(smi)"; exit 1; }
              echo
              echo "#### GGML_CUDA_FORCE_CUBLAS=ON (mmq instances unused at runtime)"
              ./build-cublas/bin/llama-bench -m "$m" "${common[@]}" \
                || { echo "::error::llama-bench (cuBLAS) failed on $(basename "$m") -- VRAM: $(smi)"; exit 1; }
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
